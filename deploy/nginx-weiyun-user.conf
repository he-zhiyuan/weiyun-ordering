# 用户端 nginx 站点配置模板，安装到 /etc/nginx/sites-available/weiyun-user
# 并软链: sudo ln -s /etc/nginx/sites-available/weiyun-user /etc/nginx/sites-enabled/weiyun-user
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/weiyun-user;
    index index.html;
    client_max_body_size 20m;

    location /user/ {
        proxy_pass http://127.0.0.1:8080/user/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
